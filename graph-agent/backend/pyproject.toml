[project]
name = "langgraph-studio"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    # Form()/UploadFile for the PDF upload endpoint. Not bundled with fastapi.
    "python-multipart",
    # PostgreSQL. The binary wheel avoids needing libpq on the host.
    "psycopg[binary,pool]>=3.2",
    # Page text extraction at upload time. The search path never re-parses a PDF.
    "pypdf>=5.1",
    # The graph the studio runs, and what the generated file imports.
    "langgraph>=0.2.60",
    "langchain-core>=0.3.28",
    "langchain-openai>=0.2.14",
]

[tool.appstore]
title = "langgraph Studio"
description = "LangGraph 에이전트를 폼으로 정의하고, 실행하고, 실행 가능한 파이썬 파일로 내보냅니다"
type = "web"
command = "python main.py"
# The studio keeps agent specs, uploaded document text and edited source in Postgres.
# Only the variable name lives here; the value is entered on the deploy screen.
env = ["DB_URL"]
llm = true
apis = []
